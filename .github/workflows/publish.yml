name: Release to PyPI

# Publishes to PyPI via trusted publishing (OIDC — no API token stored in
# GitHub) whenever a v* tag is pushed. Inert until the PyPI side is
# configured; see docs/release-runbook.md for the one-time setup and the
# full release procedure.

on:
  # Release-on-version-change: any push to main whose pyproject version has
  # no matching v* tag publishes that version (guard below makes every
  # other merge a no-op). Tag pushes and manual dispatch also release.
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # dispatch/main-push paths push the release tag
    outputs:
      skip: ${{ steps.guard.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        id: guard
        run: |
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: releasing pyproject version $PKG_VERSION from $GITHUB_REF_NAME"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if git ls-remote --exit-code origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
              echo "v$PKG_VERSION already released — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version change detected on main: releasing v$PKG_VERSION"
            fi
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION" >&2
              exit 1
            fi
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install build
          python -m build

      - name: Verify wheel contains packaged skills
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          [wheel] = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          skills = [n for n in names if n.startswith("traitprint/data/skills/")]
          assert skills, f"{wheel} is missing traitprint/data/skills"
          print(f"{wheel}: {len(skills)} skill files OK")
          EOF

      - name: Check metadata with twine
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distributions
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/traitprint/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  tag:
    # Tag only after the publish succeeded — a tag created earlier would
    # make the version-change guard skip retries of a failed release
    # forever (Codex P1 on #43). Tag pushes re-trigger this workflow, but
    # that run no-ops at the guard because the tag now exists.
    needs: [build, publish]
    if: needs.build.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release tag
        run: |
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
            echo "Tag v$PKG_VERSION already exists."
          else
            git tag "v$PKG_VERSION"
            git push origin "v$PKG_VERSION"
          fi
