name: Release to PyPI

# Publishes to PyPI via trusted publishing (OIDC — no API token stored in
# GitHub) whenever a v* tag is pushed. Inert until the PyPI side is
# configured; see docs/release-runbook.md for the one-time setup and the
# full release procedure.

on:
  push:
    tags:
      - "v*"
  # Manual release path: derives the version from pyproject.toml and
  # creates the matching v* tag itself (the tag-push trigger then no-ops
  # because the tag commit is identical). Trusted publishing matches on
  # the workflow filename + environment, so both paths publish.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # manual-dispatch path pushes the release tag

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: releasing pyproject version $PKG_VERSION from $GITHUB_REF_NAME"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION" >&2
              exit 1
            fi
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Create release tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
            echo "Tag v$PKG_VERSION already exists — publishing existing version" >&2
          else
            git tag "v$PKG_VERSION"
            git push origin "v$PKG_VERSION"
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Verify wheel contains packaged skills
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          [wheel] = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          skills = [n for n in names if n.startswith("traitprint/data/skills/")]
          assert skills, f"{wheel} is missing traitprint/data/skills"
          print(f"{wheel}: {len(skills)} skill files OK")
          EOF

      - name: Check metadata with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/traitprint/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
